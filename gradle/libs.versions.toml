robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-plugin" }
gradle-license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "gradle-license-report" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp" }