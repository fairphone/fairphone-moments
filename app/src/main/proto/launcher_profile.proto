syntax = "proto3";

option java_package = "com.fairphone.spring.launcher.data.model.protos";
option java_multiple_files = true;

message LauncherProfiles {
  string active = 1;
  string edited = 2;
  repeated LauncherProfile profiles = 3;
}

message LauncherProfile {
    string id = 1;
    string name = 2;
    string icon = 3;
    int64 bgColor1 = 4;
    int64 bgColor2 = 5;
    repeated string visibleApps = 6 [deprecated = true];
    ContactType allowedContacts = 7;
    repeated string customContacts = 8;
    bool repeatCallEnabled = 9;
    repeated string appNotifications = 10;
    int32 wallpaperId = 11;
    UiMode uiMode = 12;
    bool blueLightFilterEnabled = 13;
    SoundSetting soundSetting = 14;
    bool batterySaverEnabled = 15;
    bool reduceBrightnessEnabled = 16;
    bool ecoChargeEnabled = 17;
    bool alwaysOnDisplayEnabled = 18;
    bool airplaneModeEnabled = 19;
    string zenRuleId = 20;
    repeated LauncherProfileApp launcher_profile_apps = 21;
    LocationTrigger locationTrigger = 22;
    TimeTrigger timeTrigger = 23;
    DayTrigger dayTrigger = 24;
    MotionTrigger motionTrigger = 25;
}

message LocationTrigger {
    bool enabled = 1;
    // Legacy single location (fields 2-4), migrated into `locations`. Kept only so old
    // profiles still read; new code writes `locations`.
    double latitude = 2;
    double longitude = 3;
    float radiusMeters = 4;
    // One or more places; the trigger matches when you are within any of them.
    repeated LocationPoint locations = 5;
}

message LocationPoint {
    double latitude = 1;
    double longitude = 2;
    float radiusMeters = 3;
}

message TimeTrigger {
    bool enabled = 1;
    reserved 2; // was daysOfWeek, now its own DayTrigger axis
    // Minutes since midnight, 0..1439. If start > end the range wraps past midnight.
    int32 startMinuteOfDay = 3;
    int32 endMinuteOfDay = 4;
}

message DayTrigger {
    bool enabled = 1;
    // ISO-8601 day numbers (1 = Monday … 7 = Sunday). Empty = every day.
    repeated int32 daysOfWeek = 2;
}

// How the user is moving when the switch is flipped, classified on-device from the
// accelerometer alone — no GPS, no Google Play Services. Biking and driving are not told
// apart (that needs GPS); both fall under TRANSPORT.
enum MotionMode {
    MOTION_MODE_UNSPECIFIED = 0; // could not be determined
    MOTION_MODE_STILL = 1;
    MOTION_MODE_WALKING = 2;
    MOTION_MODE_TRANSPORT = 3; // moving but not walking (bike, car, bus, train…)
    reserved 4; // was MOTION_MODE_DRIVING, now folded into TRANSPORT
}

message MotionTrigger {
    bool enabled = 1;
    // Modes that activate this Moment. Empty = any movement (walking, biking or driving).
    repeated MotionMode modes = 2;
}

message LauncherProfileApp {
    string packageName = 1;
    bool isWorkApp = 2;
}

enum ContactType {
    CONTACT_TYPE_EVERYONE = 0;
    CONTACT_TYPE_NONE = 1;
    CONTACT_TYPE_ALL_CONTACTS = 2;
    CONTACT_TYPE_STARRED = 3;
    CONTACT_TYPE_CUSTOM = 4;
}

enum UiMode {
    UI_MODE_LIGHT = 0;
    UI_MODE_DARK = 1;
    UI_MODE_SYSTEM = 2;
}

enum SoundSetting {
    SOUND_SETTING_LOUD = 0;
    SOUND_SETTING_VIBRATE = 1;
    SOUND_SETTING_SILENT = 2;
    SOUND_SETTING_FOLLOW_DEVICE_SETTINGS = 3;
}